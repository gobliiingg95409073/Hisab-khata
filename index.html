<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>व्यापार और लेबर हिसाब किताब</title>
    <!-- Tailwind CSS for Clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 rounded-xl shadow-md mb-6 flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">📋 व्यापार हिसाब-किताब ऐप</h1>
                <p class="text-sm text-indigo-100">लेबर, सरदार और गाड़ी खर्च का दैनिक/साप्ताहिक रिकॉर्ड</p>
            </div>
            <div class="mt-3 sm:mt-0 flex gap-2">
                <button onclick="resetData()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-medium transition">डेटा रीसेट करें</button>
                <button onclick="window.print()" class="bg-indigo-700 hover:bg-indigo-800 text-white text-xs px-3 py-2 rounded-lg font-medium transition">प्रिंट / PDF</button>
            </div>
        </header>

        <!-- Balance Summary Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">शुरुआती बैलेंस (Opening Balance)</label>
                <input type="number" id="openingBalance" value="10000" onchange="calculateTotals()" class="w-full text-lg font-bold p-2 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
                <span class="block text-xs font-semibold text-slate-500 uppercase mb-1">कुल खर्च (Total Expense)</span>
                <div id="totalExpenseDisplay" class="text-2xl font-bold text-red-600 mt-2">₹0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
                <span class="block text-xs font-semibold text-slate-500 uppercase mb-1">बचा हुआ बैलेंस (Closing Balance)</span>
                <div id="closingBalanceDisplay" class="text-2xl font-bold text-green-600 mt-2">₹0</div>
            </div>
        </div>

        <!-- Weekly Entry Section -->
        <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden mb-6">
            <div class="bg-slate-100 p-4 border-b flex justify-between items-center">
                <h2 class="font-bold text-slate-700">दैनिक प्रविष्टि (Daily Entries - Week Wise)</h2>
                <button onclick="addRow()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition">+ नया दिन जोड़ें</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm" id="ledgerTable">
                    <thead>
                        <tr class="bg-slate-50 border-b text-slate-600 text-xs uppercase">
                            <th class="p-3">दिन / तारीख</th>
                            <th class="p-3">सरदार खाना (₹)</th>
                            <th class="p-3">गाड़ी/पेट्रोल/भाड़ा (₹)</th>
                            <th class="p-3">अन्य खर्च (₹)</th>
                            <th class="p-3">लेबर पेमेंट (गाड़ी बाद) (₹)</th>
                            <th class="p-3">दैनिक कुल</th>
                            <th class="p-3 text-center">एक्शन</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let defaultRows = [
            { day: "सोमवार (1 तारीख)", sardar: 1500, vehicle: 400, other: 100, labour: 0 },
            { day: "मंगलवार (2 तारीख)", sardar: 1500, vehicle: 0, other: 50, labour: 3500 },
            { day: "बुधवार (3 तारीख)", sardar: 1500, vehicle: 600, other: 0, labour: 0 },
            { day: "गुरुवार (4 तारीख)", sardar: 1500, vehicle: 0, other: 200, labour: 4000 },
            { day: "शुक्रवार (5 तारीख)", sardar: 1500, vehicle: 500, other: 0, labour: 0 },
            { day: "शनिवार (6 तारीख)", sardar: 1500, vehicle: 300, other: 150, labour: 4500 },
            { day: "रविवार (7 तारीख)", sardar: 1500, vehicle: 0, other: 0, labour: 0 }
        ];

        let entries = JSON.parse(localStorage.getItem('ledgerEntries')) || defaultRows;
        let openingInput = document.getElementById('openingBalance');
        openingInput.value = localStorage.getItem('openingBalance') || 25000;

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            entries.forEach((row, index) => {
                let dailyTotal = Number(row.sardar) + Number(row.vehicle) + Number(row.other) + Number(row.labour);
                
                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-3"><input type="text" value="${row.day}" oninput="updateData(${index}, 'day', this.value)" class="w-36 p-1 border rounded bg-slate-50 text-xs"></td>
                    <td class="p-3"><input type="number" value="${row.sardar}" oninput="updateData(${index}, 'sardar', this.value)" class="w-24 p-1 border rounded text-xs"></td>
                    <td class="p-3"><input type="number" value="${row.vehicle}" oninput="updateData(${index}, 'vehicle', this.value)" class="w-24 p-1 border rounded text-xs"></td>
                    <td class="p-3"><input type="number" value="${row.other}" oninput="updateData(${index}, 'other', this.value)" class="w-24 p-1 border rounded text-xs"></td>
                    <td class="p-3"><input type="number" value="${row.labour}" oninput="updateData(${index}, 'labour', this.value)" class="w-28 p-1 border rounded text-xs font-semibold text-indigo-600"></td>
                    <td class="p-3 font-bold text-slate-700">₹${dailyTotal}</td>
                    <td class="p-3 text-center"><button onclick="deleteRow(${index})" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1">✕</button></td>
                `;
                tbody.appendChild(tr);
            });
            calculateTotals();
        }

        function updateData(index, field, value) {
            entries[index][field] = value;
            saveAndRender();
        }

        function addRow() {
            entries.push({ day: "नया दिन", sardar: 1500, vehicle: 0, other: 0, labour: 0 });
            saveAndRender();
        }

        function deleteRow(index) {
            entries.splice(index, 1);
            saveAndRender();
        }

        function calculateTotals() {
            let totalExp = 0;
            entries.forEach(row => {
                totalExp += Number(row.sardar || 0) + Number(row.vehicle || 0) + Number(row.other || 0) + Number(row.labour || 0);
            });

            let opening = Number(openingInput.value || 0);
            let closing = opening - totalExp;

            document.getElementById('totalExpenseDisplay').innerText = `₹${totalExp.toLocaleString()}`;
            let closingElem = document.getElementById('closingBalanceDisplay');
            closingElem.innerText = `₹${closing.toLocaleString()}`;
            closingElem.className = closing >= 0 ? "text-2xl font-bold text-green-600 mt-2" : "text-2xl font-bold text-red-600 mt-2";

            localStorage.setItem('openingBalance', opening);
        }

        function saveAndRender() {
            localStorage.setItem('ledgerEntries', JSON.stringify(entries));
            renderTable();
        }

        function resetData() {
            if(confirm('क्या आप सारा डेटा रीसेट करना चाहते हैं?')) {
                localStorage.clear();
                entries = defaultRows;
                openingInput.value = 25000;
                saveAndRender();
            }
        }

        // Initial Load
        renderTable();
    </script>
</body>
</html>
